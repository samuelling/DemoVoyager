<title>Orders of Magnitude</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one stage on top; under it a logarithmic byte ruler (1 KB to 100 MB) that doubles as the tier selector;
   then the song form and three columns describing what each ceiling buys. Single dark look: it's a demo player. */
:root{
  --bg:#0c0d10; --panel:#14161a; --line:#272a31; --fg:#ebe8e1; --muted:#8e919a; --dim:#5c5f68;
  --amber:#f3aa3c; --amber-soft:rgba(243,170,60,.16);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font:15px/1.5 var(--body);font-variation-settings:"wdth" 100;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.wrap>*{min-width:0}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
h1{margin:0;font:800 clamp(26px,4.4vw,44px)/1 var(--display);font-variation-settings:"wdth" 125;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
h1 small{display:block;margin-top:8px;font:400 13px/1.4 var(--mono);letter-spacing:0;text-transform:none;color:var(--muted)}
.seedbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seedbar label{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input#seed{width:8.5ch;background:var(--panel);border:1px solid var(--line);color:var(--fg);font:500 15px var(--mono);padding:7px 10px;border-radius:3px;text-transform:uppercase}
button{font:600 13px var(--body);font-variation-settings:"wdth" 110;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:8px 13px;border-radius:3px;cursor:pointer}
button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line);overflow:hidden}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.stagecap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 18px;font:13px var(--mono);color:var(--muted);margin-top:-12px}
.stagecap b{color:var(--fg);font-weight:500}
.stagecap b.warn{color:var(--amber)}
.stage.mute{border-color:var(--amber);animation:mute 1.6s ease-in-out infinite}
@keyframes mute{50%{box-shadow:0 0 0 4px var(--amber-soft)}}
/* the ruler */
.ruler{position:relative;padding-top:4px}
.stops{position:relative;height:92px}
.stop{position:absolute;bottom:0;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;background:none;border:0;padding:6px 4px 10px;color:var(--muted)}
.stop .sz{font:800 clamp(18px,3.2vw,30px)/1 var(--display);font-variation-settings:"wdth" 120;color:var(--dim);transition:color .2s}
.stop .era{font:500 12px var(--mono)}
.stop:hover .sz{color:var(--muted)}
.stop[aria-pressed="true"] .sz{color:var(--amber)}
.stop[aria-pressed="true"] .era{color:var(--fg)}
.stop::after{content:"";width:1px;height:10px;background:var(--line)}
.stop[aria-pressed="true"]::after{background:var(--amber)}
.axis{position:relative;height:46px;border-top:1px solid var(--line)}
.tick{position:absolute;top:0;height:7px;border-left:1px solid var(--dim)}
.tick span{position:absolute;top:9px;left:0;transform:translateX(-50%);font:11px var(--mono);color:var(--dim);white-space:nowrap}
.bar{position:absolute;left:0;height:6px;border-radius:0 2px 2px 0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.code{top:-7px;background:var(--fg)}
.bar.gen{top:-7px;background:repeating-linear-gradient(90deg,var(--amber) 0 3px,transparent 3px 5px)}
.ceil{position:absolute;top:-16px;height:22px;border-left:2px solid var(--amber);transition:left .5s cubic-bezier(.2,.8,.2,1)}
.readout{display:flex;flex-wrap:wrap;gap:6px 26px;font:13px var(--mono);color:var(--muted);margin-top:-18px;font-variant-numeric:tabular-nums}
.readout b{color:var(--fg);font-weight:500}
.readout .sw{display:inline-block;width:18px;height:6px;margin-right:7px;vertical-align:middle}
.readout .rule{color:var(--amber)}
/* form */
h2{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.form{display:flex;gap:3px;min-width:0}
.seg{position:relative;min-width:0;height:44px;background:var(--panel);border-top:2px solid var(--line);padding:6px 7px;overflow:hidden}
.seg span{display:block;font:500 12px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.seg i{display:block;font:11px var(--mono);font-style:normal;color:var(--dim)}
.seg .fill{position:absolute;left:0;top:-2px;height:2px;background:var(--amber);width:0}
.seg.now span{color:var(--fg)}
.facts{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:10px;font:13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.facts b{color:var(--fg);font-weight:500}
/* structure toggle */
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg2 button{border:0;border-radius:0;background:var(--panel);color:var(--muted);padding:8px 12px}
.seg2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
/* form diagram */
.formgrid{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:22px;align-items:start}
.diagram{min-width:0}
.diagram svg{display:block;width:100%;overflow:visible}
.diagram text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.diagram .lbl{fill:var(--fg)}
.detail{min-height:1.5em;font:13px var(--mono);color:var(--fg);margin-top:6px}
.ssm{display:grid;gap:8px}
.ssm canvas{width:100%;aspect-ratio:1;image-rendering:pixelated;background:var(--panel);display:block}
.ssm p{margin:0;font:12px/1.45 var(--mono);color:var(--muted)}
.ssm b{color:var(--fg);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px var(--mono);color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
/* comparison */
.compare svg{display:block;width:100%}
.compare text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font:13px var(--mono);font-variant-numeric:tabular-nums;min-width:640px}
th,td{text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
tr.cur td{color:var(--amber)}
.lede{margin:0 0 12px;max-width:78ch;color:var(--fg);font-size:15px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;border-top:1px solid var(--line);padding-top:18px}
.cols p{margin:0;max-width:62ch;color:var(--fg);font-size:15px;line-height:1.55}
.cols h3{margin:0 0 6px;font:700 18px var(--display);font-variation-settings:"wdth" 112}
.note{font:13px/1.5 var(--mono);color:var(--muted);max-width:90ch;margin:0}
@media (max-width:760px){.formgrid{grid-template-columns:1fr}.ssm{max-width:320px}#keys{display:none}.cols{grid-template-columns:1fr}.seg i{display:none}.stops{height:76px}}
@media (prefers-reduced-motion:reduce){.bar,.ceil{transition:none}.stage.mute{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Orders of Magnitude<small id="sub">One seed, five size limits, thirty years of demo scene.</small></h1>
    <div class="seedbar">
      <label for="seed">Seed</label><input id="seed" maxlength="8" spellcheck="false" autocomplete="off" aria-label="Seed (hex)">
      <button id="newseed" type="button">New seed</button>
      <button id="nextsong" type="button" title="Fade to the next song (400K and up)">Next song</button>
      <button id="full" type="button">Fullscreen</button>
      <span class="seg2" role="group" aria-label="Song structure"><button type="button" id="mShared" aria-pressed="true">Shared form</button><button type="button" id="mFree" aria-pressed="false">Free form</button></span>
    </div>
  </header>

  <div class="stage" id="stage"><iframe id="frame" title="Demo" allow="autoplay; fullscreen"></iframe></div>
  <div class="stagecap"><span id="nowplaying"><b>Click the screen to start.</b></span><span id="keys">Keys 1–5 switch tiers</span></div>

  <section class="ruler" aria-label="Tier, on a logarithmic byte scale">
    <div class="stops" id="stops"></div>
    <div class="axis" id="axis"><div class="bar code" id="barCode"></div><div class="bar gen" id="barGen"></div><div class="ceil" id="ceil"></div></div>
    <div class="readout" id="readout"></div>
  </section>

  <section aria-label="Song form">
    <h2 id="formTitle">Form</h2>
    <div class="formgrid">
      <div class="diagram"><svg id="diag" aria-label="Form diagram"></svg><div class="detail" id="detail">Hover or tap a section for details.</div><div class="legend" id="legend"></div></div>
      <div class="ssm"><canvas id="ssm" width="160" height="160" aria-label="Self-similarity of the notes, bar by bar"></canvas><p id="ssmText"></p></div>
    </div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="compare" aria-label="Structure across tiers">
    <h2>Structure across tiers</h2>
    <p class="lede" id="cmpLede"></p>
    <svg id="cmp"></svg>
    <div class="tablewrap"><table id="cmpTable"></table></div>
  </section>

  <section class="cols" id="cols"></section>
  <p class="note" id="note"></p>
</div>

<script>/*CORE*/</script>
<script>
(()=>{
const SIZES=/*SIZES*/{};
const KB=1024,MB=1048576;
const T=[
 {id:'4k',label:'4K',ceil:4*KB,era:'1995',rule:'file',L:-1,
  comp:'Its own pocket composer: one minor-key loop of four chords, two seeded motifs, a templated drum pattern, and ten 4-bar blocks that switch voices in and out. The last third lifts the key.',
  sound:'Six voices rendered once into a single mono buffer at start: sine kick, noise snare and hats, saw bass, square arpeggio, triangle lead, one feedback echo, then crushed to 8 bits.',
  pics:'320×200 software pixels: plasma, an XOR tunnel, moiré rings, metaballs, a starfield, voxel flight and a planet with a passing fleet, with a lens bouncing over the plasmas. The file is compressed JavaScript that unpacks itself.'},
 {id:'40k',label:'40K',ceil:40*KB,era:'1997',rule:'file',L:0,
  free:'Fixed in both modes: the 40K file plays its tracker module as written. It is the baseline the free forms grow from.',
  comp:'The shared composer writes a tracker module: 64-row patterns on six channels, a seeded mode and progression, motifs that are varied, inverted and sequenced, and a verse–chorus form.',
  sound:'A small tracker engine plays the six channels through synthesized instruments, with per-note volume commands and an echo channel trailing the lead.',
  pics:'19 software-rendered scenes at 320×200: voxel landscapes, glenz vectors, metaballs, rotozoom, fire, twisters and a flying fleet. It boots from a DOS prompt.'},
 {id:'400k',label:'400K',ceil:400*KB,era:'2003',rule:'file',L:1,
  free:'Free form, one level: a string of 8- and 16-bar sections over two themes. A return may be varied, lifted an octave or thinned, and nothing more.',
  comp:'The same song, arranged. Every section plays twice and the repeat is varied: passing tones into leaps, an octave lift at the phrase end, a busier bass and a new fill. Voice-led pads and real arpeggios join.',
  sound:'A softsynth: detuned subtractive voices, synthesized drums, tempo-synced stereo delay and a generated reverb.',
  pics:'Hardware 3D at 800×600: textured tunnels, ship fleets over a planet, a city at night, particles and terrain, with glow and feedback post effects.'},
 {id:'4m',label:'4M',ceil:4*MB,era:'2012',rule:'mem',L:2,
  free:'Free form, two levels: parts made of sections, three themes placed in related keys, builds and drops. A return may carry two of nine transformations: varied, octave, thinned, transposed, fragmented, augmented, reharmonised, half-time or in thirds.',
  comp:'Recomposed from the song’s raw material as a big-room track: intro, verse, build, drop, break, second build, second drop, outro. Builds rise with snare rolls and risers; drops land on an impact.',
  sound:'Supersaws, sidechain ducking from the kick, claps and shakers, white-noise risers, filter sweeps and a longer generated hall.',
  pics:'Every scene is a raymarched distance field: terrain with soft shadows, an Apollonian fractal, a reflective corridor, metaballs, a pulsing block city and a ringed tunnel. The form picks the scene.'},
 {id:'40m',label:'40M',ceil:40*MB,era:'2026',rule:'mem',L:3,
  free:'Free form, three levels: movements, sections and phrases of 4 to 16 bars, five themes on a tonal plan, odd meters (3/4, 7/8, 5/4), and returns with up to three of fourteen transformations, adding inversion, retrograde, diminution, canon and modal mixture. Themes can sound together in counterpoint.',
  comp:'Recomposed again in a sonata-like form: prelude, theme A, theme B in the relative key, a development that walks the circle of fifths with a canon, a build, a climax and a coda that ends on a Picardy third. A counter-melody moves against the tune.',
  sound:'Physically modelled instruments built at start: Karplus-Strong plucks and harp, a modal piano with inharmonic partials, modal taiko and timpani, plus strings, choir and oboe in a long hall.',
  pics:'The GPU simulates: an ink tank (stable fluids), reaction-diffusion grown as a surface, a volumetric nebula and a 131,072-particle swarm that morphs between shapes and spells the title.'},
];
const fmt=b=>b>=MB?(b/MB).toFixed(b>=10*MB?1:2)+' MB':b>=KB?(b/KB).toFixed(b>=10*KB?1:2)+' KB':b+' B';
const X=b=>Math.max(0,Math.min(1,(Math.log10(b)-3)/(Math.log10(100*MB)-3)))*100;
const $=id=>document.getElementById(id);
let tier=1,seed=0,started=false,live={},form=null,free=false;
try{const k=localStorage.getItem('oom-tier');if(k!==null&&T[+k])tier=+k;free=localStorage.getItem('oom-free')==='1';}catch(e){}
const hm=/^#?([0-9a-fA-F]{1,8})(-free)?$/.exec(location.hash||'');seed=hm?parseInt(hm[1],16)>>>0:(Math.random()*4294967296)>>>0;if(hm)free=!!hm[2];

// ruler
for(const [b,l] of [[KB,'1 KB'],[10*KB,'10 KB'],[100*KB,'100 KB'],[MB,'1 MB'],[10*MB,'10 MB'],[100*MB,'100 MB']]){const d=document.createElement('div');d.className='tick';d.style.left=X(b)+'%';d.innerHTML='<span>'+l+'</span>';$('axis').appendChild(d);}
T.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='stop';b.style.left=X(t.ceil)+'%';b.innerHTML=`<span class="sz">${t.label}</span><span class="era">${t.era}</span>`;b.onclick=()=>pick(i);t.el=b;$('stops').appendChild(b);});

// ---- what each tier writes for this seed, as one common description per section
const MATCOL={A:'#f3aa3c',B:'#6fb3d9',C:'#b48ce0',D:'#7cc79a',E:'#e58a7a'},NEUTRAL='#5c5f68';
const ROLEWORD={intro:'intro',outro:'outro',build:'build',bridge:'bridge',drop:'drop',climax:'climax',break:'break',development:'development',state:'statement',ret:'return',variation:'variation'};
const KEYS=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
// the shared (fixed) forms, described in the same terms as the free ones
const SH={
  intro:{role:'intro',e:.15},outro:{role:'outro',e:.25},build:{role:'build',e:.6,mat:'A',xf:[]},
  A:{mat:'A',e:.6},A2:{mat:'A',e:.65,xf:['vary']},A3:{mat:'A',e:.8,xf:['vary','transpose'],up:1},B:{mat:'B',e:.6},B2:{mat:'B',e:.65,xf:['vary']},break:{role:'break',mat:'B',e:.2},
  verse:{mat:'A',e:.5,xf:['thin']},'build 2':{role:'build',e:.6,mat:'A',xf:['fragment','sequence']},drop:{role:'drop',mat:'A',e:.95,xf:['harmony']},'drop 2':{role:'drop',mat:'A',e:1,xf:['harmony','transpose'],up:1},
  prelude:{role:'intro',e:.15,mat:'A',xf:['augment']},'theme A':{mat:'A',e:.55,xf:['vary']},'theme B':{mat:'B',e:.6,rel:1},development:{role:'development',mat:'A',e:.6,xf:['fragment','sequence','canon']},
  climax:{role:'climax',mat:'A',e:1,xf:['transpose','combine'],up:1},coda:{role:'outro',e:.25,xf:['invert','augment','modal']}};
function sharedSecs(list,song,L){const seen={};let r=0;return list.map(([name,rows])=>{const d=SH[name]||{mat:'A',e:.5};let role=d.role;
  if(!role){role=seen[d.mat]?'ret':'state';seen[d.mat]=1;}
  const xf=(d.xf||[]).slice();if(L===1&&!/intro|outro/.test(name)&&!xf.includes('vary'))xf.push('vary');
  const o={name,start:r,len:rows,bars:rows/16,meter:16,role,mat:d.mat||null,xf,tr:d.up?(song.mat.modUp||2):0,key:d.up?(song.mat.modUp||2):d.rel?(song.minor?3:-3):0,energy:d.e};r+=rows;return o;});}
// the 40K tracker module as note events, so its similarity can be measured like the others
function trackerEvents(song){const ev=[];let R0=0;for(const s of song.sections){const P=song.pats[s.pat];
  for(const c of [2,3,4,5]){let open=null;for(let r=0;r<ROWS;r++){const n=P[r][c].n;if(n===null)continue;if(open){open.d=R0+r-open.t;open=null;}if(n>0){open={i:c===4?'lead':c===2?'bass':c===3?'arp':'pad',t:R0+r,n,d:1};ev.push(open);}}if(open)open.d=R0+ROWS-open.t;}
  for(let r=0;r<ROWS;r++)for(const c of [0,1])if(P[r][c].n>0)ev.push({i:'kick',t:R0+r});R0+=ROWS;}return ev;}
function composeAll(sd,free){const song=genSong(sd),res=[];
  const k4=[['intro','intro',.15],['groove','build',.4],['A','A',.7],['A','A',.7],['break','break',.25],['B','B',.7],['B','B',.7],['groove','build',.5],['A lift','A',.85],['outro','outro',.3]];
  res.push({secs:k4.map(([n,m,e],i)=>({name:n,start:i*64,len:64,bars:4,meter:16,role:/^[AB]/.test(m)?(i===2||i===5?'state':'ret'):m,mat:/^[AB]/.test(m)?m:null,xf:n==='A lift'?['transpose']:[],key:n==='A lift'?2:0,energy:e})),rows:640,levels:1,ev:null,len:null});
  {const secs=sharedSecs(song.sections.map(s=>[s.name,ROWS]),song,0);res.push({secs,rows:song.sections.length*ROWS,levels:1,ev:trackerEvents(song),len:timeOf(song,song.sections.length*ROWS)});}
  for(const L of [1,2,3]){const sc=free?arrangeFree(song,L):arrange(song,L);
    const secs=free?sc.secs.map(x=>Object.assign({},x,{tr:x.rel?x.key-(song.minor?3:-3):x.key,mat:/intro|outro|build|bridge/.test(x.role)?null:x.mat})):sharedSecs(sc.secs.map(x=>[x.name,x.len]),song,L);
    const levels=free?(L===1?1:sc.tree.kids.some(g=>g.kids.some(k=>k.kids))?3:2):1;
    res.push({secs,rows:sc.rows,levels,ev:sc.ev,tree:free?sc.tree:null,len:timeOf(song,sc.rows)});}
  for(const r of res)r.sim=r.ev?similarity(r,song):null;
  return{song,res,free};}

// bar-by-bar similarity of what is actually played, in the terms a listener recognises a tune by:
// melody intervals and scale degrees (so a transposed return still matches), melody rhythm, harmony as scale degrees, drum density
const MEL=/^(lead|leadx|oboe|bell|keys|harm|piano)$/,DRUM=/^(kick|snare|hat|ohat|clap|shaker|taiko|tom|crash)$/,NF=48;
function similarity(r,song){const bars=[];for(const sc of r.secs)for(let b=0;b<sc.bars;b++)bars.push({t0:sc.start+b*sc.meter,len:sc.meter,sec:sc});
  const F=bars.map(()=>new Float32Array(NF)),drum=new Float32Array(bars.length);const idx=t=>{let lo=0,hi=bars.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(bars[m].t0<=t)lo=m;else hi=m-1;}return lo;};
  const deg=(n,B)=>(((n-song.key-(B.sec.tr||0))%12)+12)%12;const mel=[];
  for(const e of r.ev){if(e.t<0||e.t>=r.rows)continue;const k=idx(e.t),B=bars[k],f=F[k],v=e.v??1;
    if(DRUM.test(e.i)){drum[k]+=v;continue;}const ns=e.ns||(e.n!=null?[e.n]:[]);if(!ns.length)continue;const w=Math.min(e.d||1,B.len)*v;
    if(MEL.test(e.i)&&v>.55){mel.push(e);f[deg(e.n,B)]+=w*.8;f[27+Math.min(7,Math.floor((e.t-B.t0)/B.len*8))]+=.6;}else if(!MEL.test(e.i))for(const n of ns)f[35+deg(n,B)]+=w*.12;}
  mel.sort((a,b)=>a.t-b.t);for(let i=1;i<mel.length;i++){const k=idx(mel[i].t);if(mel[i].t===mel[i-1].t)continue;F[k][12+Math.max(-7,Math.min(7,mel[i].n-mel[i-1].n))+7]+=1;}
  F.forEach((f,k)=>{f[47]=.25*Math.min(1,drum[k]/24);});
  for(const f of F){let s=0;for(let i=0;i<NF;i++)s+=f[i]*f[i];s=Math.sqrt(s)||1;for(let i=0;i<NF;i++)f[i]/=s;}
  const N=bars.length,S=new Float32Array(N*N);for(let i=0;i<N;i++)for(let j=i;j<N;j++){let d=0;const a=F[i],b=F[j];for(let k=0;k<NF;k++)d+=a[k]*b[k];S[i*N+j]=S[j*N+i]=d;}
  // d': do bars of sections built on the same theme sound more alike than bars of different themes?
  // compare sections bar for bar from their starts (the way a listener lines up a returning phrase)
  const first=new Map();bars.forEach((B,i)=>{if(!first.has(B.sec))first.set(B.sec,i);});const secs=r.secs.filter(x=>x.mat),same=[],diff=[];
  for(let p=0;p<secs.length;p++)for(let q=p+1;q<secs.length;q++){const a=secs[p],b=secs[q],i0=first.get(a),j0=first.get(b),n=Math.min(a.bars,b.bars);
    for(let k=0;k<n;k++)(a.mat===b.mat?same:diff).push(S[(i0+k)*N+j0+k]);}
  const mv=x=>{const m=x.reduce((p,q)=>p+q,0)/x.length;return[m,x.reduce((p,q)=>p+(q-m)*(q-m),0)/x.length];};
  let dp=null;if(same.length>3&&diff.length>3){const [ms,vs]=mv(same),[md,vd]=mv(diff);dp=(ms-md)/Math.sqrt((vs+vd)/2||1e-6);}
  return{S,N,bars,dp};}

function stats(r){const mats=new Set(r.secs.filter(x=>x.mat).map(x=>x.mat)),xf=new Set(),keys=new Set(),met=new Set();
  for(const x of r.secs){x.xf.forEach(y=>{if(y!=='sub'&&y!=='meter')xf.add(y);});keys.add((x.key||0)+(x.rel?'r':''));met.add(x.meter);}
  return{secs:r.secs.length,levels:r.levels,themes:mats.size,xf:xf.size,keys:keys.size,meters:met.size,bars:r.secs.reduce((a,x)=>a+x.bars,0)};}

// ---- the form diagram: hierarchy brackets, sections (colour = theme, fill = energy), arcs from each return to its source, key plan
const meterName=m=>({12:'3/4',14:'7/8',16:'4/4',20:'5/4'})[m]||m+'/16';
const keyName=(song,k)=>KEYS[((song.key+k)%12+12)%12];
const svgEl=(tag,at,txt)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;return e;};
function describe(x,song){const bits=[ROLEWORD[x.role]||x.role];if(x.mat)bits.push('theme '+x.mat);const xf=x.xf.filter(y=>y!=='meter').map(y=>XF_LABEL[y]||y);if(xf.length)bits.push(xf.join(', '));
  bits.push(keyName(song,x.key||0)+(x.rel?' (relative)':''));bits.push(`${x.bars} bars of ${meterName(x.meter)}`);bits.push(`energy ${x.energy.toFixed(2)}`);return `${x.name}: `+bits.join(' · ');}
let playX=null;
function drawDiagram(){const r=form.res[tier],song=form.song,svg=$('diag');svg.innerHTML='';const W=Math.max(300,svg.clientWidth||600),tot=r.rows,xs=t=>t/tot*W;
  const lv=r.tree?(r.levels>=3?2:1):0,top=lv*18+4,BH=46,arcY=top+BH+4,maxArc=58,keyY=arcY+maxArc+14,H=keyY+34;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);
  // brackets from the plan tree
  if(r.tree){let i=0;const leafStart=k=>r.secs[k].start,leafEnd=k=>r.secs[k].start+r.secs[k].len;
    for(const g of r.tree.kids){const n0=i;for(const k of g.kids){if(k.kids){const a=i;i+=k.kids.length;if(lv>=2){const x0=xs(leafStart(a)),x1=xs(leafEnd(i-1));svg.append(svgEl('path',{d:`M${x0+1} ${top-2}V${top-7}H${x1-1}V${top-2}`,stroke:'#5c5f68',fill:'none'}));if(x1-x0>46)svg.append(svgEl('text',{x:x0+3,y:top-10},k.label));}}else i++;}
      if(g.label){const x0=xs(leafStart(n0)),x1=xs(leafEnd(i-1));svg.append(svgEl('path',{d:`M${x0+1} 16V10H${x1-1}V16`,stroke:'#8e919a',fill:'none'}));svg.append(svgEl('text',{x:x0+3,y:7,class:'lbl','font-size':'10'},g.label.toUpperCase()));}}}
  // sections
  const firstOf={};r.secs.forEach((x,k)=>{const x0=xs(x.start),w=Math.max(1,xs(x.len)-2),col=x.mat?MATCOL[x.mat]:NEUTRAL,g=svgEl('g',{tabindex:0});
    g.append(svgEl('rect',{x:x0,y:top,width:w,height:BH,fill:col,'fill-opacity':.14}));
    g.append(svgEl('rect',{x:x0,y:top+BH*(1-x.energy),width:w,height:BH*x.energy,fill:col,'fill-opacity':x.role==='development'||x.role==='bridge'?.35:.6}));
    if(x.meter!==16)g.append(svgEl('rect',{x:x0,y:top,width:w,height:3,fill:'#ebe8e1'}));
    if(w>34)g.append(svgEl('text',{x:x0+4,y:top+13,class:'lbl'},x.name.length*6.6>w-6?x.name.slice(0,Math.max(1,Math.floor((w-8)/6.6))):x.name));
    g.append(svgEl('title',{},describe(x,song)));const show=()=>{$('detail').textContent=describe(x,song);};g.addEventListener('mouseenter',show);g.addEventListener('focus',show);g.addEventListener('click',show);svg.append(g);
    // arc back to where this theme was last heard
    if(x.mat&&/ret|variation|drop|climax|break|development|state/.test(x.role)){const prev=firstOf[x.mat];if(prev&&x.role!=='state'){const a=xs(prev.start+prev.len/2),b=xs(x.start+x.len/2),h=Math.min(maxArc,(b-a)*.45);
        const pth=svgEl('path',{d:`M${a} ${arcY}C${a} ${arcY+h*1.33} ${b} ${arcY+h*1.33} ${b} ${arcY}`,stroke:MATCOL[x.mat],'stroke-opacity':.75,'stroke-width':x.xf.filter(y=>y!=='sub').length?1.5:2.5,fill:'none'});
        if(x.xf.length)pth.setAttribute('stroke-dasharray',x.xf.length>1?'2 3':'6 3');svg.append(pth);}
      if(!firstOf[x.mat]||x.role==='state')firstOf[x.mat]=x;else firstOf[x.mat]=x;}});
  // key plan
  svg.append(svgEl('text',{x:0,y:keyY-6},'key'));let last=null,d='';r.secs.forEach(x=>{const k=(x.key||0)+(x.rel?.5:0),y=keyY+12-k*1.6,x0=xs(x.start),x1=xs(x.start+x.len);d+=(d?`L${x0} ${y}`:`M${x0} ${y}`)+`H${x1}`;
    const nm=keyName(song,x.key||0)+(x.rel?'*':'');if(nm!==last&&x1-x0>14)svg.append(svgEl('text',{x:x0+2,y:y-4,class:'lbl'},nm));last=nm;});
  svg.append(svgEl('path',{d,stroke:'#ebe8e1','stroke-width':1.5,fill:'none'}));
  playX=svgEl('line',{x1:0,x2:0,y1:0,y2:H,stroke:'#f3aa3c','stroke-width':1.5,opacity:0});svg.append(playX);
  $('legend').innerHTML=[...new Set(r.secs.filter(x=>x.mat).map(x=>x.mat))].sort().map(m=>`<span><i style="background:${MATCOL[m]}"></i>theme ${m}</span>`).join('')+
    `<span><i style="background:${NEUTRAL}"></i>intro, build, bridge, outro</span><span>fill height = energy</span><span>arcs = a theme returning (dashed = transformed)</span>`+(r.secs.some(x=>x.meter!==16)?'<span>white top edge = odd meter</span>':'')+(r.secs.some(x=>x.rel)?'<span>* relative key</span>':'');}

function drawSSM(){const r=form.res[tier],cv=$('ssm'),x=cv.getContext('2d');x.fillStyle='#14161a';x.fillRect(0,0,cv.width,cv.height);
  if(!r.sim){$('ssmText').innerHTML='The 4K song is made by its own composer inside the 4K file, so its notes are not measured here.';return;}
  const {S,N,bars,dp}=r.sim,c=cv.width,im=x.createImageData(c,c);
  // smoothed along the diagonal (three bars), the usual way to make repeated passages read as stripes
  const Sm=new Float32Array(N*N);for(let i=0;i<N;i++)for(let j=0;j<N;j++){let t=0,c2=0;for(let k=-1;k<=1;k++){const a=i+k,b=j+k;if(a<0||b<0||a>=N||b>=N)continue;t+=S[a*N+b];c2++;}Sm[i*N+j]=t/c2;}
  const vals=[];for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)vals.push(Sm[i*N+j]);vals.sort((p,q)=>p-q);const lo=vals[Math.floor(vals.length*.15)]||0,hi=vals[Math.floor(vals.length*.995)]||1;
  for(let py=0;py<c;py++)for(let px=0;px<c;px++){const i=Math.floor(py/c*N),j=Math.floor(px/c*N),v=Math.max(0,Math.min(1,(Sm[i*N+j]-lo)/(hi-lo||1))),k=(py*c+px)*4,a=Math.pow(v,1.6);
    im.data[k]=20+a*(243-20);im.data[k+1]=22+a*(170-22);im.data[k+2]=26+a*(60-26);im.data[k+3]=255;}
  x.putImageData(im,0,0);let t=0;x.strokeStyle='rgba(235,232,225,.35)';x.lineWidth=1;for(const s of r.secs){t+=s.bars;const p=Math.round(t/N*c)+.5;x.beginPath();x.moveTo(p,0);x.lineTo(p,c);x.moveTo(0,p);x.lineTo(c,p);x.stroke();}
  $('ssmText').innerHTML=`<b>What the notes show.</b> Each pixel compares two bars by melody (intervals and scale degrees), rhythm and harmony; bright squares off the diagonal are music coming back. `+
    (dp==null?'Too few themed sections to score.':`Lining sections up bar for bar, same-theme pairs vs different-theme pairs: <b>d′ = ${dp.toFixed(2)}</b>. `+(dp>1.5?'The form is easy to hear.':dp>.7?'The form is audible but partly disguised.':'The transformations largely hide the form.'));}

function drawCompare(){const svg=$('cmp');svg.innerHTML='';const W=Math.max(300,svg.clientWidth||600),LW=48,RH=34,H=T.length*RH+18,maxR=Math.max(...form.res.map(r=>r.rows));
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('height',H);const xs=t=>LW+t/maxR*(W-LW);
  form.res.forEach((r,ti)=>{const y=ti*RH+4,cur=ti===tier;svg.append(svgEl('text',Object.assign({x:0,y:y+15},cur?{fill:'#f3aa3c','font-weight':600}:{}),T[ti].label));
    const firstOf={};r.secs.forEach(x=>{const x0=xs(x.start),w=Math.max(1,xs(x.start+x.len)-x0-1),col=x.mat?MATCOL[x.mat]:NEUTRAL;
      svg.append(svgEl('rect',{x:x0,y:y+6,width:w,height:12,fill:col,'fill-opacity':.25+.6*x.energy}));
      if(x.mat){const p=firstOf[x.mat];if(p&&x.role!=='state'){const a=xs(p.start+p.len/2),b=xs(x.start+x.len/2),h=Math.min(9,(b-a)*.2);svg.append(svgEl('path',{d:`M${a} ${y+5}C${a} ${y+5-h*1.3} ${b} ${y+5-h*1.3} ${b} ${y+5}`,stroke:MATCOL[x.mat],'stroke-opacity':.7,fill:'none'}));}firstOf[x.mat]=x;}});});
  svg.append(svgEl('text',{x:LW,y:H-2},'0'));svg.append(svgEl('text',{x:W,y:H-2,'text-anchor':'end'},`${Math.round(maxR/16)} bars`));
  const rows=form.res.map((r,ti)=>{const st=stats(r),m=r.len?Math.floor(r.len/60)+':'+String(Math.round(r.len%60)).padStart(2,'0'):'–';
    return `<tr class="${ti===tier?'cur':''}"><td>${T[ti].label}</td><td>${st.secs}</td><td>${st.levels}</td><td>${st.themes}</td><td>${st.xf}</td><td>${st.keys}</td><td>${st.meters}</td><td>${st.bars}</td><td>${m}</td><td>${r.sim&&r.sim.dp!=null?r.sim.dp.toFixed(2):'–'}</td></tr>`;});
  $('cmpTable').innerHTML='<thead><tr><th>Tier</th><th>Sections</th><th>Levels</th><th>Themes</th><th>Transforms</th><th>Keys</th><th>Meters</th><th>Bars</th><th>Length</th><th>d′ heard</th></tr></thead><tbody>'+rows.join('')+'</tbody>';
  $('cmpLede').textContent=form.free?'Free form: each tier writes its own structure from the same material, using as much as its allowance permits. The last column asks whether that structure is audible: d′ compares how alike bars of the same theme sound against bars of different themes.':
    'Shared form: every tier from 40K up follows the same song; larger tiers re-arrange or recompose it within a fixed plan. Switch to Free form to let each tier write its own structure.';}

function drawForm(){const r=form.res[tier],song=form.song,st=stats(r),m=r.len?Math.floor(r.len/60)+':'+String(Math.round(r.len%60)).padStart(2,'0'):'';
  $('formTitle').textContent=`Form at ${T[tier].label}`+(tier>=2?(form.free?' · free':' · shared'):'');$('detail').textContent='Hover or tap a section for details.';
  drawDiagram();drawSSM();drawCompare();
  let ev=0;if(r.ev)for(const e of r.ev)ev+=e.ns?e.ns.length:1;
  $('facts').innerHTML=tier===0?`<span><b>${r.secs.length}</b> blocks</span><span><b>${st.bars}</b> bars</span><span><b>6</b> voices</span><span>its own key and tempo</span>`:
    `<span><b>${st.secs}</b> sections</span><span><b>${st.levels}</b> level${st.levels>1?'s':''}</span><span><b>${st.themes}</b> themes</span><span><b>${st.xf}</b> transformations</span><span><b>${st.keys}</b> key area${st.keys>1?'s':''}</span><span><b>${st.bars}</b> bars</span><span><b>${m}</b></span><span><b>${ev.toLocaleString('en-US')}</b> notes and hits</span><span><b>${song.bpm}</b> bpm</span><span>${song.desc.key.toLowerCase()}</span>`;}

function drawMeter(){const t=T[tier],code=SIZES[t.id]||0,gen=t.rule==='mem'&&live.tier===t.label?live.generated:0;
  $('barCode').style.width=X(code)+'%';$('barGen').style.width=gen?X(gen)+'%':'0';$('barGen').style.top=gen?'-14px':'-7px';$('ceil').style.left=X(t.ceil)+'%';
  const lim=t.label.replace(/[KM]$/,' $&B');const rule=t.rule==='file'?`Rule: the file must fit in ${lim}`:`Rule: everything it generates must fit in ${lim}`;
  $('readout').innerHTML=`<span class="rule">${rule}</span><span><i class="sw" style="background:var(--fg)"></i>file <b>${fmt(code)}</b>${t.rule==='file'?` · ${(code/t.ceil*100).toFixed(1)}% of the limit`:''}</span>`+
    (t.rule==='mem'?`<span><i class="sw" style="background:repeating-linear-gradient(90deg,var(--amber) 0 3px,transparent 3px 5px)"></i>generated <b>${gen?fmt(gen):'starts with the demo'}</b>${gen?` · ${(gen/t.ceil*100).toFixed(1)}% of the limit`:''}</span>`:'');}

function drawCols(){const t=T[tier];$('cols').innerHTML=`<div><h3>Composition</h3><p>${free&&t.free?t.free:t.comp}</p></div><div><h3>Sound</h3><p>${t.sound}</p></div><div><h3>Pictures</h3><p>${t.pics}</p></div>`;
  $('note').textContent=t.rule==='mem'?'At 4M and 40M the code is free; the meter counts every texture, render target, mesh, sample bank and impulse response the demo builds while it runs.':tier===0?'The 4K tier has room only for its own tiny composer, so its song differs from the others. Every tier from 40K up starts from the same composition for a given seed.':'From 40K up, the seed produces the same composition; each tier then arranges, voices and pictures it as far as its limit allows.';}

function load(){const t=T[tier],f=$('frame');live={};const nf=f.cloneNode();nf.src=`tiers/${t.id}.html#${seed.toString(16).toUpperCase().padStart(8,'0')}${free&&t.L>0?'-free':''}`;f.replaceWith(nf);
  nf.addEventListener('load',()=>{if(started&&t.L>0)try{nf.contentWindow.postMessage({demoseedCmd:'start'},'*');}catch(e){}});
  T.forEach((x,i)=>x.el.setAttribute('aria-pressed',i===tier));$('seed').value=seed.toString(16).toUpperCase().padStart(8,'0');
  $('nowplaying').innerHTML=t.L>0&&started?'<b>Starting…</b>':'<b>Click the screen to start.</b> '+(t.id==='40k'?'It boots from DOS.':'');
  $('nextsong').disabled=t.L<1;try{history.replaceState(null,'','#'+$('seed').value+(free?'-free':''));}catch(e){}
  $('mShared').setAttribute('aria-pressed',!free);$('mFree').setAttribute('aria-pressed',free);
  $('sub').textContent=free?'One seed, five size limits, thirty years of demo scene. Same material at every tier; each tier writes its own form.':'One seed, five size limits, thirty years of demo scene. Same song at every tier from 40K up.';
  drawForm();drawMeter();drawCols();}
function pick(i){tier=i;try{localStorage.setItem('oom-tier',i);}catch(e){}load();}
function setSeed(s){seed=s>>>0;form=composeAll(seed,free);load();}
function setFree(f){free=f;try{localStorage.setItem('oom-free',f?'1':'0');}catch(e){}form=composeAll(seed,free);load();}

addEventListener('message',e=>{const d=e.data;if(!d||!d.demoseed)return;live=d;if(d.state==='play'||d.state==='fadeout')started=true;
  if(d.seed&&parseInt(d.seed,16)!==seed){seed=parseInt(d.seed,16)>>>0;form=composeAll(seed,free);$('seed').value=d.seed;drawForm();try{history.replaceState(null,'','#'+d.seed+(free?'-free':''));}catch(_){}}
  const mute=d.sound==='suspended';$('stage').classList.toggle('mute',mute);
  if(mute)$('nowplaying').innerHTML='<b class="warn">Sound is off. Click the screen to turn it on.</b>';else if(d.title)$('nowplaying').innerHTML=`<b>${d.title}</b> by ${d.group} · seed ${d.seed}`;
  if(playX&&d.pos!=null&&d.rows&&d.state==='play'&&d.tier===T[tier].label){const W=+$('diag').getAttribute('viewBox').split(' ')[2],x=Math.min(1,d.pos/d.rows)*W;playX.setAttribute('x1',x);playX.setAttribute('x2',x);playX.setAttribute('opacity',1);}
  drawMeter();});
window.addEventListener('blur',()=>{if(document.activeElement===$('frame'))started=true;});
$('seed').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parseInt(e.target.value,16);if(!isNaN(v))setSeed(v);}});
$('seed').addEventListener('change',e=>{const v=parseInt(e.target.value,16);if(!isNaN(v)&&v>>>0!==seed)setSeed(v);});
$('mShared').onclick=()=>setFree(false);$('mFree').onclick=()=>setFree(true);
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(form){drawDiagram();drawCompare();}},150);});
$('newseed').onclick=()=>setSeed((Math.random()*4294967296)>>>0);
$('nextsong').onclick=()=>{try{$('frame').contentWindow.postMessage({demoseedCmd:'next'},'*');}catch(e){}};
$('full').onclick=()=>{const s=$('stage');try{(s.requestFullscreen||s.webkitRequestFullscreen).call(s);}catch(e){}};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const n=+e.key;if(n>=1&&n<=5)pick(n-1);});
setSeed(seed);
})();
</script>
